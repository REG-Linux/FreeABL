name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # edk2-freeabl is private for now: give a token with read access to it.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-15 llvm-18 gcc-aarch64-linux-gnu \
            build-essential uuid-dev python3 python3-cryptography device-tree-compiler
      - name: Routing logic unit test
        run: |
          E=edk2/QcomModulePkg
          cc -Wall -Wextra -Werror -DESP_HOST_TEST -I$E/Include/Library -o /tmp/bdt \
            test/boot_dispatch_test.c $E/Library/BootLib/BootDispatch.c
          /tmp/bdt | tail -1
      - name: Flash tool test (simulated device)
        run: python3 test/flash/test-flash.py
      - name: Build all SoCs
        run: |
          clang-18 --version | head -1; ld.lld-15 --version
          ./build-all.sh | tee summary.txt
          ! grep -q '^FAIL' summary.txt
      - name: Images match the flash tool's signature formats
        run: |
          python3 - <<'EOF'
          import importlib.util, sys
          s = importlib.util.spec_from_file_location('f', 'tools/freeabl-flash.py')
          f = importlib.util.module_from_spec(s); s.loader.exec_module(f)
          want = dict(f.SOC_MBN)
          assert all(want[d['soc']] == d['mbn'] for d in f.DEVICES.values())
          bad = 0
          for soc, v in want.items():
              got = f.mbn_version(f'out/abl_signed-{soc.upper()}-ESP-r34.elf')
              print(soc, got); bad += got != v
          sys.exit(bad)
          EOF
      - name: Licences and source references
        run: |
          cp LICENSE THIRD_PARTY_LICENSES.md FLASHING.md tools/freeabl-flash.py out/
          {
            echo "FreeABL images, GPL-3.0-or-later. Source code:"
            echo "  https://github.com/REG-Linux/FreeABL commit $(git rev-parse HEAD)"
            echo "  https://github.com/REG-Linux/edk2-freeabl commit $(git -C edk2 rev-parse HEAD)"
            echo "  https://github.com/msm8916-mainline/qtestsign commit $(git -C tools/qtestsign rev-parse HEAD) (signing tool)"
            echo "Third-party licences and notices: THIRD_PARTY_LICENSES.md"
          } > out/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: freeabl-images
          path: |
            out/*.elf*
            out/LICENSE
            out/THIRD_PARTY_LICENSES.md
            out/SOURCE.txt
            out/FLASHING.md
            out/freeabl-flash.py
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Vendor bundles match their pinned sources
        run: web/build-vendor.sh && git diff --exit-code -- web/vendor
      - name: Steps on the simulated device
        run: node --test web/test/core.test.mjs
      - name: Page in headless Chrome (simulated device)
        run: |
          npm i --no-save --no-package-lock --prefix web puppeteer-core@25.9.0
          CHROME=$(command -v google-chrome) node web/test/ui-smoke.mjs
